app-id: org.negpy.NegPy
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: negpy
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-run/gvfs:ro

modules:
  - name: negpy
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
      - install -D negpy.desktop /app/share/applications/org.negpy.NegPy.desktop
      - install -D org.negpy.NegPy.metainfo.xml /app/share/metainfo/org.negpy.NegPy.metainfo.xml
      - install -D media/icons/512x512.png /app/share/icons/hicolor/512x512/apps/org.negpy.NegPy.png
    sources:
      - type: dir
        path: .
