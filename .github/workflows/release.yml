name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      publish:
        description: 'Create the GitHub release (off for a test build)'
        required: true
        default: true
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Linux builds on a fixed Ubuntu: the AppImage needs the oldest glibc it can get, and
      # ubuntu-latest moves to a newer release on its own.
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.platform }}" == "all" ]; then
            echo 'matrix=[{"os":"ubuntu-24.04"},{"os":"windows-latest"},{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "windows" ]; then
            echo 'matrix=[{"os":"windows-latest"}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "linux" ]; then
            echo 'matrix=[{"os":"ubuntu-24.04"}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "macos" ]; then
            echo 'matrix=[{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"}]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build for ${{ matrix.os }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Rust
        # uv sync builds negpy_core with the toolchain pinned in negpy_core/rust-toolchain.toml.
        working-directory: negpy_core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: negpy_core

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 patchelf libsane-dev
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Install System Dependencies (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: brew install sane-backends

      - name: Install Packaging Tools (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install nsis -y
          # Look for makensis.exe and add to PATH
          $nsisPath = Get-ChildItem -Path "C:\Program Files*" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($nsisPath) {
            echo "Found NSIS at: $nsisPath"
            echo "$nsisPath" >> $GITHUB_PATH
          }

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: uv sync --all-groups

      - name: Install Dependencies (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: CFLAGS="-I$(brew --prefix)/include" LDFLAGS="-L$(brew --prefix)/lib" uv sync --all-groups

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        # Everything except SANE, which has no Windows build. `--all-groups` rather
        # than the default groups alone, or pieusb / plustek ship uninstalled and
        # the Scan tab has no working backend on Windows.
        run: uv sync --all-groups --no-group sane

      - name: Set Version
        shell: bash
        run: |
          echo "${{ github.event.inputs.version }}" | sed 's/^v//' > VERSION

      - name: Set macOS target architecture
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: echo "NEGPY_MACOS_ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Build and Package Application
        run: uv run python build.py

      - name: List dist directory
        shell: bash
        run: ls -R dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: negpy-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}-${{ github.event.inputs.version }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: success() && inputs.publish
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-binaries
          pattern: negpy-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: NegPy ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            all-binaries/**/*.AppImage
            all-binaries/**/*-Setup.exe
            all-binaries/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
