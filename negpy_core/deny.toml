[graph]
all-features = true

[licenses]
# Each must be GPL-3.0 compatible. Add a license here only after that check.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "Unicode-3.0"]
private = { ignore = true }

[bans]
multiple-versions = "allow"
# negpy_core builds no C or C++: a codec that needs a C library stays on its Python wheel.
deny = [{ name = "cc" }, { name = "cmake" }, { name = "pkg-config" }, { name = "bindgen" }]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
